services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: quiz
            POSTGRES_PASSWORD: quiz
            POSTGRES_DB: quiz_builder
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U quiz -d quiz_builder']
            interval: 3s
            timeout: 3s
            retries: 10

    backend:
        build: ./backend
        environment:
            PORT: 4000
            FRONTEND_URL: http://localhost:3000
            JWT_SECRET: dev-secret-change-me
            DATABASE_URL: postgresql://quiz:quiz@db:5432/quiz_builder?schema=public
        ports:
            - '4000:4000'
        depends_on:
            db:
                condition: service_healthy

    frontend:
        build:
            context: ./frontend
            args:
                NEXT_PUBLIC_API_URL: http://localhost:4000
        ports:
            - '3000:3000'
        depends_on:
            - backend

volumes:
    pgdata:
